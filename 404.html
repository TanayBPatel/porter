<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Chat Porter</title>
<link rel="icon" href="/porter/favicon.png">
<meta name="theme-color" content="#0f302d">

<style>
  :root { color-scheme: light dark; --bg:#f3f3f5; --surface:#fff; --ink:#1b1c22; --muted:#6e6e73; --line:#e5e5ea; --accent:#0a84ff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141417; --surface:#1f1f24; --ink:#f5f5f7; --muted:#a1a1a8; --line:#2c2c30; --accent:#409cff; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  main { max-width: 620px; margin: 0 auto; padding: 96px 24px; }
  .brand { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
  h1 { font-size: 56px; line-height: 1; letter-spacing: -.04em; margin: 14px 0 10px; }
  p { color: var(--muted); }
  a { color: var(--accent); }
  .button { display: inline-block; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; padding: 10px 16px; border-radius: 9px; margin: 10px 0; }
  footer { margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
</style>
</head>

<main>
  <div class="brand">Chat Porter</div>
  <h1>404</h1>

</main>
</body>
</html>
